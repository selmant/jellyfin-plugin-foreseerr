---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Tag v<ReleaseVersion> to release. Builds both Jellyfin ABIs with the
# Foreseerr version in foreseerr.version, proves them in real Jellyfin
# servers, publishes the GitHub release, then refreshes the repository
# manifest on GitHub Pages.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, prove, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Check tag, version, and release notes
        id: version
        run: |
          set -euo pipefail
          version="$(dotnet msbuild Foreseerr.Jellyfin/Foreseerr.Jellyfin.csproj -getProperty:ReleaseVersion)"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match Build.props ReleaseVersion $version"
            exit 1
          fi
          notes="release-notes/$version.md"
          test -s "$notes" || { echo "::error::Missing $notes"; exit 1; }
          {
            echo "version=$version"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          dotnet test Foreseerr.Jellyfin.Tests/Foreseerr.Jellyfin.Tests.csproj -c Release -p:JellyfinTarget=10.11
          dotnet test Foreseerr.Jellyfin.Tests/Foreseerr.Jellyfin.Tests.csproj -c Release -p:JellyfinTarget=12

      - name: Compile Foreseerr sidecars
        id: foreseerr
        run: |
          scripts/sidecar.sh
          echo "version=$(jq -r .version .foreseerr/package.json)" >> "$GITHUB_OUTPUT"

      - name: Pack plugin archives and manifest
        run: |
          scripts/build.sh 10.11
          scripts/build.sh 12
          bun scripts/merge-manifests.mjs

      - name: Prove Jellyfin installation and SSO
        run: |
          bun scripts/prove.mjs 10.11
          bun scripts/prove.mjs 12

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          FORESEERR: ${{ steps.foreseerr.outputs.version }}
          NOTES: ${{ steps.version.outputs.notes }}
        run: |
          set -euo pipefail
          cd dist/release
          sha256sum foreseerr-jellyfin-manifest.json >> SHA256SUMS
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "${prerelease[@]}" \
            --title "Foreseerr for Jellyfin $VERSION (Foreseerr $FORESEERR)" \
            --notes-file "$GITHUB_WORKSPACE/$NOTES" \
            foreseerr-jellyfin-10.11.zip \
            foreseerr-jellyfin-12.zip \
            foreseerr-jellyfin-manifest.json \
            SHA256SUMS

      - name: Publish repository manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          versions="$(jq -r '.[0].versions[].version' dist/release/foreseerr-jellyfin-manifest.json)"
          url="https://selmant.github.io/jellyfin-plugin-foreseerr/manifest.json"
          for _ in $(seq 60); do
            live="$(curl -fsSL "$url?release=$VERSION" 2>/dev/null | jq -r '.[0].versions[].version' 2>/dev/null || true)"
            if [[ -n "$live" ]] && ! grep -vxF -f <(echo "$live") <<< "$versions" >/dev/null; then
              echo "$url lists $VERSION"
              exit 0
            fi
            sleep 20
          done
          echo "::error::$url does not list $VERSION after 20 minutes"
          exit 1
