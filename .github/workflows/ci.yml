---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Builds the plugin against the pinned Foreseerr version and installs it into
# real Jellyfin servers. The weekly run builds Foreseerr develop instead, to
# catch changes on the Foreseerr side before its next release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      foreseerr_ref:
        description: Foreseerr tag or branch to bundle (default foreseerr.version)
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Jellyfin ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        abi: ['10.11', '12']
    env:
      FORESEERR_REF: ${{ github.event_name == 'schedule' && 'develop' || inputs.foreseerr_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - run: dotnet test Foreseerr.Jellyfin.Tests/Foreseerr.Jellyfin.Tests.csproj -c Release -p:JellyfinTarget=${{ matrix.abi }}
      - run: scripts/sidecar.sh linux-x64
      - run: scripts/build.sh '${{ matrix.abi }}' linux-x64
      - run: bun scripts/prove.mjs '${{ matrix.abi }}'
